<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="100%" stop-color="#11131C" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Background & Subtle Architectural Grid -->
  <rect width="960" height="400" rx="14" fill="url(#bg)" stroke="#232734" stroke-width="1.5" />
  <rect width="960" height="400" rx="14" fill="url(#grid)" />

  <!-- Top Bar: Monogram & Domain Tag -->
  <text x="56" y="54" fill="#F8FAFC" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">pg.</text>
  <text x="904" y="52" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="2.5" text-anchor="end">CLOUD · CODE · INTELLIGENCE</text>

  <!-- Eyebrow -->
  <text x="56" y="108" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="3">ENGINEERING WITH INTENT</text>

  <!-- Main Heading & Role -->
  <text x="56" y="164" fill="#FFFFFF" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.5">Prabhat Gupta.</text>
  <text x="56" y="200" fill="#CBD5E1" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="-0.3">Senior Software Engineer</text>

  <!-- Value Proposition -->
  <text x="56" y="242" fill="#94A3B8" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="15">
    Turning complex problems into intelligent systems. <tspan fill="#E2E8F0" font-weight="500">Cloud-native architecture. AI-driven products. Real-world impact.</tspan>
  </text>

  <!-- Divider Line -->
  <line x1="56" y1="282" x2="904" y2="282" stroke="#1E293B" stroke-width="1.5" />

  <!-- Concrete Proof / Metrics Row -->
  <g transform="translate(56, 330)">
    <text x="0" y="0" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-1">8+</text>
    <text x="0" y="24" fill="#64748B" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.5">YEARS OF EXPERIENCE</text>

    <text x="225" y="0" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-1">15+</text>
    <text x="225" y="24" fill="#64748B" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.5">PROJECTS DELIVERED</text>

    <text x="450" y="0" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-1">95%+</text>
    <text x="450" y="24" fill="#64748B" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.5">AWS COST REDUCTION</text>

    <text x="675" y="0" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" letter-spacing="-1">100ms</text>
    <text x="675" y="24" fill="#64748B" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="0.5">OPTIMIZED API LATENCY</text>
  </g>
</svg>
